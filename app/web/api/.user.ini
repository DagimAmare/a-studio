; Lets videos up to 64 MB through PHP (a little headroom for the form).
; cPanel picks this up within a few minutes. If big videos still fail, set
; the same values in cPanel > MultiPHP INI Editor for astudio.hepius.co.
upload_max_filesize = 80M
post_max_size = 85M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
